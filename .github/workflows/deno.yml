
name: Remotion Video Renderer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Remotion Browser
        run: pnpm exec remotion browser ensure

      - name: Render MP4
        run: pnpm render

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 7
